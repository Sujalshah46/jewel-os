name: Verify remediation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jewel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jewel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/jewel_test
      UPGRADE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/jewel_upgrade_test
      RESTORE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/jewel_restore_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Create disposable upgrade database
        run: psql postgresql://postgres:postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE jewel_upgrade_test' -c 'CREATE DATABASE jewel_restore_test'
      - name: Run unit, API, schema, and migration tests
        run: npm run test:all
      - name: Build demo mode
        run: npm run build:demo
      - name: Build operational mode
        run: npm run build:operational
